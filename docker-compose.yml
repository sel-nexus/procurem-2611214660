services:
  backend:
    build: ./backend
    environment:
      DATABASE_PATH: /data/procurem.db
      SEED_ON_STARTUP: 'true'
      CORS_ORIGINS: http://localhost:3000
      COOKIE_SECURE: 'false'
    volumes:
      - procurem-data:/data
    ports:
      - '8000:8000'
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - '3000:3000'
volumes:
  procurem-data:
